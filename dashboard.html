<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>INAP – Progression</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#18212f}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border:1px solid #d6dce6;border-radius:10px;background:#fff;cursor:pointer}.primary{background:#111827;color:#fff}.cards,.subject-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.history-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 22px #0000000d}.big{font-size:28px;font-weight:750}.muted{color:#667085}.cloud,.badge{padding:7px 10px;border-radius:9px;background:#eef2ff;font-size:13px;display:inline-block}.history-list{display:grid;gap:10px}.history-head{display:flex;justify-content:space-between;gap:10px}.history-score{font-size:20px;font-weight:750}.points{margin-top:8px;font-weight:700}.pass{color:#166534}.fail{color:#991b1b}.hidden{display:none!important}@media(max-width:700px){.wrap{padding:10px}.cards,.subject-grid{grid-template-columns:repeat(2,1fr)}.history-head{display:block}.actions .btn{flex:1 1 40%}}</style></head><body><div class="wrap"><div class="top"><div><h1>Ma progression INAP</h1><div id="cloudState" class="cloud">Chargement…</div></div><div class="actions"><button class="btn primary" onclick="location.href='./'">Retour au quiz</button><button class="btn" onclick="reloadCloud()">Actualiser</button><button class="btn" onclick="exportData()">Exporter</button><label class="btn">Importer<input id="imp" type="file" accept="application/json" class="hidden"></label></div></div><div class="cards"><div class="card"><div class="muted">Tests</div><div id="sessions" class="big">0</div></div><div class="card"><div class="muted">Moyenne</div><div id="avg" class="big">–</div></div><div class="card"><div class="muted">Meilleur</div><div id="best" class="big">–</div></div><div class="card"><div class="muted">Barème examen</div><div class="big">160/240</div></div></div><h2>Par matière</h2><div class="subject-grid" id="subjects"></div><h2>Historique des quiz</h2><p class="muted">Recalcul rétroactif : chaque matière vaut 60 points. Chaque réponse fausse ou sans réponse retire 3 points.</p><div id="history" class="history-list"></div></div><script>
const U='https://ltjpusvagvxvzqtwrnat.supabase.co',K='sb_publishable_PFvxiUzbxH-3hwabCZdnpA_N03eidiP',sb=supabase.createClient(U,K);let current=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(r){return{date:r.created_at,mode:r.mode,scope:r.scope,score:r.score,total:r.total,percent:r.percent,breakdown:r.breakdown||'',by:r.by_subject||{},source:'Cloud'}}
function subjectPoints(ok,total){ok=Number(ok)||0;total=Number(total)||0;if(!total)return null;return Math.max(0,60-(total-ok)*3)}
function examPoints(x){const entries=Object.entries(x.by||{});if(entries.length!==4)return null;return entries.reduce((n,[,v])=>n+subjectPoints(v[0],v[1]),0)}
function pointDetail(x){return Object.entries(x.by||{}).map(([s,v])=>s+': '+subjectPoints(v[0],v[1])+'/60 ('+v[0]+'/'+v[1]+' justes)').join(' • ')}
async function reloadCloud(){const {data:{user}}=await sb.auth.getUser();if(!user)return location.replace('./');const {data:allowed}=await sb.rpc('is_allowed_user');if(allowed!==true)return location.replace('./');const {data,error}=await sb.from('inap_results').select('*').order('created_at',{ascending:true});if(error){$('cloudState').textContent='Accès refusé';return}current=(data||[]).map(norm);$('cloudState').textContent='Cloud sécurisé : '+user.email+' — '+current.length+' test(s)';render()}
function render(){let h=current;$('sessions').textContent=h.length;if(!h.length){$('avg').textContent=$('best').textContent='–';$('subjects').innerHTML='';$('history').innerHTML='<div class="history-card muted">Aucun test enregistré.</div>';return}let ps=h.map(x=>Number(x.percent)||0);$('avg').textContent=Math.round(ps.reduce((a,b)=>a+b,0)/ps.length)+'%';$('best').textContent=Math.max(...ps)+'%';let agg={};h.forEach(x=>Object.entries(x.by||{}).forEach(([s,v])=>{agg[s]??={ok:0,total:0};agg[s].ok+=+v[0]||0;agg[s].total+=+v[1]||0}));$('subjects').innerHTML=['PGP','DOAP','CGE','CCC'].map(s=>{let a=agg[s];return '<div class="card"><b>'+s+'</b><div class="big">'+(a?subjectPoints(a.ok,a.total)+'/60':'–')+'</div><div class="muted">'+(a?a.ok+'/'+a.total+' bonnes réponses cumulées':'Aucune donnée')+'</div></div>'}).join('');$('history').innerHTML=[...h].reverse().map(x=>{let ep=examPoints(x),detail=pointDetail(x),single=Object.keys(x.by||{}).length===1,sp=single?subjectPoints(Object.values(x.by)[0][0],Object.values(x.by)[0][1]):null,pts=ep!=null?'<div class="points '+(ep>=160?'pass':'fail')+'">Barème officiel : '+ep+'/240 '+(ep>=160?'— seuil global atteint':'— sous 160/240')+'</div>':sp!=null?'<div class="points">Barème officiel : '+sp+'/60</div>':'';return '<div class="history-card"><div class="history-head"><div><b>'+new Date(x.date).toLocaleString('fr-FR')+'</b><div class="muted">'+esc(x.mode||'—')+' • '+esc(x.scope||'—')+' • Cloud</div></div><div class="history-score">'+x.score+'/'+x.total+' ('+x.percent+'%)</div></div>'+pts+'<div class="muted" style="margin-top:7px">'+esc(detail||x.breakdown||'–')+'</div></div>'}).join('')}
function exportData(){const b=new Blob([JSON.stringify(current,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='inap-progression.json';a.click();URL.revokeObjectURL(a.href)}
function validSession(x){return x&&typeof x==='object'&&x.date&&x.mode&&x.scope&&Number.isFinite(Number(x.score))&&Number.isFinite(Number(x.total))&&Number.isFinite(Number(x.percent))&&x.by&&typeof x.by==='object'&&!Array.isArray(x.by)}
$('imp').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;try{const raw=JSON.parse(await file.text()),arr=Array.isArray(raw)?raw:(Array.isArray(raw.sessions)?raw.sessions:[]);if(!arr.length)throw new Error('Aucune session trouvée dans ce fichier.');const clean=arr.filter(validSession);if(!clean.length)throw new Error('Format de progression INAP non reconnu.');const {data:{user}}=await sb.auth.getUser();if(!user)return location.replace('./');const {data:allowed}=await sb.rpc('is_allowed_user');if(allowed!==true)return location.replace('./');const rows=clean.map(x=>({user_id:user.id,created_at:new Date(x.date).toISOString(),mode:String(x.mode),scope:String(x.scope),score:Number(x.score),total:Number(x.total),percent:Number(x.percent),breakdown:String(x.breakdown||''),by_subject:x.by}));const {data:existing,error:readErr}=await sb.from('inap_results').select('created_at,mode,scope,score,total');if(readErr)throw readErr;const keys=new Set((existing||[]).map(x=>[new Date(x.created_at).toISOString(),x.mode,x.scope,x.score,x.total].join('|'))),fresh=rows.filter(x=>!keys.has([x.created_at,x.mode,x.scope,x.score,x.total].join('|')));if(!fresh.length){alert('Aucun nouveau résultat à importer : ces sessions semblent déjà présentes.');return}const {error}=await sb.from('inap_results').insert(fresh);if(error)throw error;alert(fresh.length+' résultat'+(fresh.length>1?'s':'')+' importé'+(fresh.length>1?'s':'')+' dans ton compte.');await reloadCloud()}catch(err){alert('Import impossible : '+(err?.message||err))}finally{e.target.value=''}});
reloadCloud();
</script></body></html>
