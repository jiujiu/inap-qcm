<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>INAP – Progression</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#18212f}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{padding:10px 14px;border:1px solid #d6dce6;border-radius:10px;background:#fff;cursor:pointer}.primary{background:#111827;color:#fff}.cards,.subject-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.history-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 6px 22px #0000000d}.big{font-size:28px;font-weight:750}.muted{color:#667085}.cloud,.badge{padding:7px 10px;border-radius:9px;background:#eef2ff;font-size:13px;display:inline-block}.history-list{display:grid;gap:10px}.history-head{display:flex;justify-content:space-between;gap:10px}.history-score{font-size:20px;font-weight:750}.points{margin-top:8px;font-weight:700}.pass{color:#166534}.fail{color:#991b1b}.hidden{display:none!important}@media(max-width:700px){.wrap{padding:10px}.cards,.subject-grid{grid-template-columns:repeat(2,1fr)}.history-head{display:block}.actions .btn{flex:1 1 40%}}</style></head><body><div class="wrap"><div class="top"><div><h1>Ma progression INAP</h1><div id="cloudState" class="cloud">Chargement…</div></div><div class="actions"><button class="btn primary" onclick="location.href='./'">Retour au quiz</button><button class="btn" onclick="reloadCloud()">Actualiser</button><button class="btn" onclick="exportData()">Exporter</button><label class="btn">Importer<input id="imp" type="file" accept="application/json" class="hidden"></label></div></div><div class="cards"><div class="card"><div class="muted">Tests</div><div id="sessions" class="big">0</div></div><div class="card"><div class="muted">Moyenne</div><div id="avg" class="big">–</div></div><div class="card"><div class="muted">Meilleur</div><div id="best" class="big">–</div></div><div class="card"><div class="muted">Barème examen</div><div class="big">160/240</div></div></div><h2>Par matière</h2><div class="subject-grid" id="subjects"></div><h2>Historique des quiz</h2><p class="muted">Recalcul rétroactif : chaque matière vaut 60 points. Chaque réponse fausse ou sans réponse retire 3 points.</p><div id="history" class="history-list"></div></div><script>const U='https://ltjpusvagvxvzqtwrnat.supabase.co',K=['sb_publishable_PFvxiUzbxH-3h','wabCZdnpA_N03eidiP'].join(''),sb=window.supabase.createClient(U,K),KEY='inapHistoryV1';let current=[];const $=id=>document.getElementById(id);const local=()=>{try{let x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function norm(r){return{date:r.created_at,mode:r.mode,scope:r.scope,score:r.score,total:r.total,percent:r.percent,breakdown:r.breakdown||'',by:r.by_subject||{},source:'Cloud'}}function key(x){return[new Date(x.date).getTime(),x.mode,x.scope,x.score,x.total].join('|')}function merge(a,b){let m=new Map;b.forEach(x=>m.set(key(x),x));a.forEach(x=>m.set(key(x),{...(m.get(key(x))||{}),...x,source:m.has(key(x))?'Cloud + local':'Local'}));return[...m.values()].sort((x,y)=>new Date(x.date)-new Date(y.date))}function subjectPoints(ok,total){ok=Number(ok)||0;total=Number(total)||0;if(!total)return null;const errors=total-ok;return Math.max(0,60-errors*3)}function examPoints(x){const entries=Object.entries(x.by||{});if(entries.length!==4)return null;let pts=0;for(const[,v]of entries){const p=subjectPoints(v[0],v[1]);if(p==null)return null;pts+=p}return pts}function pointDetail(x){const e=Object.entries(x.by||{});if(!e.length)return'';return e.map(([s,v])=>`${s}: ${subjectPoints(v[0],v[1])}/60 (${v[0]}/${v[1]} justes)`).join(' • ')}async function reloadCloud(){let l=local(),u=null;try{u=(await sb.auth.getUser()).data?.user}catch{}if(!u){current=merge(l,[]);$('cloudState').textContent=`Local : ${current.length} test(s)`;render();return}try{let {data,error}=await sb.from('quiz_results').select('*').order('created_at',{ascending:true});if(error)throw error;current=merge(l,(data||[]).map(norm));$('cloudState').textContent=`Cloud : ${u.email} — ${current.length} test(s)`}catch{current=merge(l,[]);$('cloudState').textContent='Cloud indisponible — données locales'}render()}function render(){let h=current;$('sessions').textContent=h.length;if(!h.length){$('avg').textContent=$('best').textContent='–';$('subjects').innerHTML='';$('history').innerHTML='<div class="history-card muted">Aucun test enregistré.</div>';return}let ps=h.map(x=>Number(x.percent)||0);$('avg').textContent=Math.round(ps.reduce((a,b)=>a+b,0)/ps.length)+'%';$('best').textContent=Math.max(...ps)+'%';let agg={};h.forEach(x=>Object.entries(x.by||{}).forEach(([s,v])=>{agg[s]??={ok:0,total:0};agg[s].ok+=+v[0]||0;agg[s].total+=+v[1]||0}));$('subjects').innerHTML=['PGP','DOAP','CGE','CCC'].map(s=>{let a=agg[s];return`<div class="card"><b>${s}</b><div class="big">${a?subjectPoints(a.ok,a.total)+'/60':'–'}</div><div class="muted">${a?`${a.ok}/${a.total} bonnes réponses cumulées`:'Aucune donnée'}</div></div>`}).join('');$('history').innerHTML=[...h].reverse().map(x=>{let ep=examPoints(x),detail=pointDetail(x),single=Object.keys(x.by||{}).length===1,sp=single?subjectPoints(Object.values(x.by)[0][0],Object.values(x.by)[0][1]):null;let pts=ep!=null?`<div class="points ${ep>=160?'pass':'fail'}">Barème officiel : ${ep}/240 ${ep>=160?'— seuil global atteint':'— sous 160/240'}</div>`:sp!=null?`<div class="points">Barème officiel : ${sp}/60</div>`:'';return`<div class="history-card"><div class="history-head"><div><b>${new Date(x.date).toLocaleString('fr-FR')}</b><div class="muted">${esc(x.mode||'—')} • ${esc(x.scope||'—')} • ${esc(x.source||'')}</div></div><div class="history-score">${x.score}/${x.total} (${x.percent}%)</div></div>${pts}<div class="muted" style="margin-top:7px">${esc(detail||x.breakdown||'–')}</div></div>`}).join('')}function exportData(){let b=new Blob([JSON.stringify(local(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='inap-progression-local.json';a.click();URL.revokeObjectURL(a.href)}$('imp').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;localStorage.setItem(KEY,JSON.stringify(d));reloadCloud()}catch{alert('Fichier invalide')}};r.readAsText(f)};sb.auth.onAuthStateChange(()=>setTimeout(reloadCloud,0));reloadCloud();</script></body></html>
