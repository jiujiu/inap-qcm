<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Erreurs par matière – INAP QCM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#18212f;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{padding:10px 14px;border:1px solid #d7dde8;border-radius:10px;background:#fff;color:#18212f;text-decoration:none}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat,.section{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 18px #0000000d}.stat b{font-size:25px;display:block}.section{margin:16px 0}.section h2{margin:0 0 12px}.error{border-top:1px solid #eef1f5;padding:14px 0}.error:first-of-type{border-top:0}.meta{font-size:12px;color:#667085}.question{font-weight:700;margin:6px 0 10px}.bad{color:#991b1b}.good{color:#166534}.explanation{background:#f8fafc;padding:10px;border-radius:9px;margin-top:8px;line-height:1.45}.empty{color:#667085}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filters button{padding:9px 13px;border:1px solid #d7dde8;background:#fff;border-radius:9px;cursor:pointer}.filters button.active{background:#111827;color:#fff}@media(max-width:700px){.wrap{padding:10px}.summary{grid-template-columns:repeat(2,1fr)}}
</style></head><body><div class="wrap">
<div class="top"><div><h1 style="margin-bottom:4px">Mes erreurs par matière</h1><div style="color:#667085">Toutes les erreurs enregistrées dans l’historique de tes QCM.</div></div><a class="btn" href="./">Retour aux QCM</a></div>
<div id="summary" class="summary"></div>
<div class="filters"><button class="active" data-filter="ALL">Toutes</button><button data-filter="PGP">PGP</button><button data-filter="DOAP">DOAP</button><button data-filter="CGE">CGE</button><button data-filter="CCC">CCC</button></div>
<div id="content"></div>
</div><script>
const U='https://ltjpusvagvxvzqtwrnat.supabase.co',K='sb_publishable_PFvxiUzbxH-3hwabCZdnpA_N03eidiP',sb=supabase.createClient(U,K),subjects=['PGP','DOAP','CGE','CCC'];let all=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const {data:{user}}=await sb.auth.getUser();if(!user)return location.replace('./');const {data:allowed}=await sb.rpc('is_allowed_user');if(allowed!==true)return location.replace('./');const {data,error}=await sb.from('inap_errors').select('*').order('session_date',{ascending:false});if(error){content.innerHTML='<section class="section">Accès refusé.</section>';return}all=(data||[]).map(e=>({...e,sessionDate:e.session_date,correct:e.correct_answer}));render()}
function render(filter='ALL'){const counts=Object.fromEntries(subjects.map(s=>[s,all.filter(e=>e.subject===s).length]));summary.innerHTML=subjects.map(s=>'<div class="stat"><span>'+s+'</span><b>'+counts[s]+'</b><small>erreur'+(counts[s]===1?'':'s')+'</small></div>').join('');const shown=filter==='ALL'?subjects:subjects.filter(s=>s===filter);content.innerHTML=shown.map(s=>{const items=all.filter(e=>e.subject===s);return '<section class="section"><h2>'+s+' — '+items.length+' erreur'+(items.length===1?'':'s')+'</h2>'+(items.length?items.map(e=>'<article class="error"><div class="meta">'+(e.sessionDate?new Date(e.sessionDate).toLocaleString('fr-FR'):'')+(e.concept?' • '+esc(e.concept):'')+'</div><div class="question">'+esc(e.question)+'</div><div class="bad"><b>Ta réponse :</b> '+esc(e.selected??'Sans réponse')+'</div><div class="good"><b>Bonne réponse :</b> '+esc(e.correct??'')+'</div>'+(e.explanation?'<div class="explanation"><b>Explication :</b> '+esc(e.explanation)+'</div>':'')+'</article>').join(''):'<div class="empty">Aucune erreur enregistrée dans cette matière.</div>')+'</section>'}).join('')}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.filter)});load();
</script></body></html>
