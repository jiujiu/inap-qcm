<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INAP QCM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#18212f}body{display:flex;flex-direction:column}.nav{min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#111827;color:#fff;box-shadow:0 2px 10px #0002;z-index:2;gap:10px}.nav b{font-size:17px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions button{border:1px solid #ffffff44;background:#ffffff12;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.actions button:hover{background:#ffffff22}.status{font-size:12px;color:#d1d5db}.authbox{display:flex;gap:6px;align-items:center}.authbox input{width:210px;padding:8px;border-radius:8px;border:0}.hidden{display:none!important}iframe{border:0;width:100%;flex:1;background:#f5f7fb}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 25px #0004;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:360px}.toast.show{opacity:1;transform:none}@media(max-width:760px){.nav{padding:8px 10px;align-items:flex-start;flex-direction:column}.nav b{font-size:14px}.actions button{padding:8px 9px;font-size:12px}.authbox input{width:180px}iframe{min-height:calc(100vh - 110px)}}
</style></head><body>
<div class="nav"><b>INAP – QCM d'entraînement</b><div class="actions"><span id="cloudStatus" class="status">Cloud : non connecté</span><div id="loginBox" class="authbox"><input id="email" type="email" placeholder="ton@email.com"><button onclick="sendMagicLink()">Connexion</button></div><button id="logoutBtn" class="hidden" onclick="logout()">Déconnexion</button><button onclick="document.getElementById('quizFrame').src='quiz.html'">Nouveau test</button><button onclick="location.href='dashboard.html'">Ma progression</button></div></div>
<iframe id="quizFrame" src="quiz.html" title="Quiz INAP"></iframe><div id="toast" class="toast"></div>
<script>
const SUPABASE_URL='https://ltjpusvagvxvzqtwrnat.supabase.co';
const SUPABASE_KEY='sb_publishable_PFvxiUzbxH-3hwabCZdnpA_N03eidiP';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const KEY='inapHistoryV1';
const frame=document.getElementById('quizFrame');
let wasVisible=false,currentUser=null,lastHandledDate=null;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function getLocal(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}
function setLocal(h){localStorage.setItem(KEY,JSON.stringify(h))}
function toRow(item){return{created_at:item.date,user_id:currentUser.id,mode:item.mode,scope:item.scope,score:item.score,total:item.total,percent:item.percent,breakdown:item.breakdown||'',by_subject:item.by||{}}}
async function refreshAuth(){const {data}=await sb.auth.getUser();currentUser=data?.user||null;loginBox.classList.toggle('hidden',!!currentUser);logoutBtn.classList.toggle('hidden',!currentUser);cloudStatus.textContent=currentUser?'Cloud : '+currentUser.email:'Cloud : non connecté';if(currentUser)await syncLocalToCloud()}
async function sendMagicLink(){const e=email.value.trim();if(!e)return showToast('Entre ton adresse email.');const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin+location.pathname}});showToast(error?'Erreur : '+error.message:'Lien de connexion envoyé par email.')}
async function logout(){await sb.auth.signOut();currentUser=null;refreshAuth();showToast('Déconnecté.')}
async function pushCloud(item){if(!currentUser)return false;const {error}=await sb.from('quiz_results').insert(toRow(item));if(error){console.error(error);showToast('Résultat conservé localement ; cloud indisponible.');return false}return true}
function markSynced(date){const h=getLocal();const x=h.find(v=>v.date===date);if(x){x.cloud_synced=true;setLocal(h)}}
async function syncLocalToCloud(){if(!currentUser)return;const pending=getLocal().filter(x=>!x.cloud_synced);for(const item of pending){if(await pushCloud(item))markSynced(item.date)}}
async function handleFinishedQuiz(doc){let item=null;try{item=frame.contentWindow.getLastCompletedSession?.()}catch{}if(!item){try{item=JSON.parse(localStorage.getItem('inapLastCompletedSession')||'null')}catch{}}
if(!item||item.date===lastHandledDate)return;lastHandledDate=item.date;
if(currentUser){const ok=await pushCloud(item);if(ok){markSynced(item.date);showToast('Résultat sauvegardé localement et dans le cloud ✓')}else showToast('Résultat sauvegardé localement.')}
else showToast('Résultat sauvegardé localement. Connecte-toi pour le synchroniser.')}
function watch(){try{const d=frame.contentDocument;if(!d)return;const r=d.getElementById('result');if(!r)return;const visible=!r.classList.contains('hidden');if(visible&&!wasVisible)handleFinishedQuiz(d);wasVisible=visible}catch{}}
frame.addEventListener('load',()=>{wasVisible=false;lastHandledDate=null;setTimeout(watch,300)});
setInterval(watch,500);
sb.auth.onAuthStateChange(()=>setTimeout(refreshAuth,0));
refreshAuth();
</script></body></html>
