<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>INAP QCM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#18212f}body{display:flex;flex-direction:column;min-width:0}.nav{min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#111827;color:#fff;box-shadow:0 2px 10px #0002;z-index:2;gap:10px}.nav b{font-size:17px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}.actions button{border:1px solid #ffffff44;background:#ffffff12;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.status{font-size:12px;color:#d1d5db}.authbox{display:flex;gap:6px;align-items:center}.authbox input{width:210px;max-width:100%;padding:8px;border-radius:8px;border:0}.hidden{display:none!important}iframe{border:0;width:100%;min-width:0;flex:1;background:#f5f7fb}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 25px #0004;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:min(360px,calc(100vw - 24px));z-index:20}.toast.show{opacity:1;transform:none}@media(max-width:760px){.nav{padding:8px 10px;align-items:stretch;flex-direction:column}.nav b{font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.actions .status{grid-column:1/-1}.authbox{grid-column:1/-1;width:100%}.authbox input{flex:1;width:auto;min-width:0}.actions button{padding:8px 9px;font-size:12px;min-height:38px}.authbox button{flex:0 0 auto}iframe{min-height:calc(100vh - 145px)}}</style></head><body><div class="nav"><b>INAP – QCM d'entraînement</b><div class="actions"><span id="cloudStatus" class="status">Cloud : non connecté</span><div id="loginBox" class="authbox"><input id="email" type="email" placeholder="ton@email.com" autocomplete="email" onkeydown="if(event.key==='Enter'){window.sendMagicLink();}"><button id="loginBtn" type="button" onclick="window.sendMagicLink()">Connexion</button></div><button id="logoutBtn" class="hidden" type="button" onclick="window.logout()">Déconnexion</button><button type="button" onclick="window.newTest()">Nouveau test</button><button type="button" onclick="location.href='dashboard.html'">Ma progression</button></div></div><iframe id="quizFrame" src="quiz.html" title="Quiz INAP"></iframe><div id="toast" class="toast"></div><script>const SUPABASE_URL='https://ltjpusvagvxvzqtwrnat.supabase.co';const SUPABASE_KEY='sb_publishable_PFvxiUzbxH-3hwabCZdnpA_N03eidiP';const sb=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);const KEY='inapHistoryV1';const frame=document.getElementById('quizFrame');const loginBtn=document.getElementById('loginBtn');const logoutBtn=document.getElementById('logoutBtn');const loginBox=document.getElementById('loginBox');const cloudStatus=document.getElementById('cloudStatus');let wasVisible=false,currentUser=null,lastHandledDate=null;function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4000)}function getLocal(){try{const x=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(x)?x:[]}catch{return[]}}function setLocal(h){localStorage.setItem(KEY,JSON.stringify(h))}function newTest(){frame.src='quiz.html?'+Date.now()}function toRow(item){return{created_at:item.date,user_id:currentUser.id,mode:item.mode,scope:item.scope,score:item.score,total:item.total,percent:item.percent,breakdown:item.breakdown||'',by_subject:item.by||{}}}async function refreshAuth(){if(!sb){cloudStatus.textContent='Cloud indisponible — historique local actif';return}try{const {data,error}=await sb.auth.getUser();if(error)throw error;currentUser=data?.user||null;loginBox.classList.toggle('hidden',!!currentUser);logoutBtn.classList.toggle('hidden',!currentUser);cloudStatus.textContent=currentUser?'Cloud : '+currentUser.email:'Cloud : non connecté';if(currentUser)await syncLocalToCloud()}catch(e){console.error('Auth',e);currentUser=null;loginBox.classList.remove('hidden');logoutBtn.classList.add('hidden');cloudStatus.textContent='Cloud : non connecté'}}async function sendMagicLink(){const input=document.getElementById('email'),btn=document.getElementById('loginBtn'),status=document.getElementById('cloudStatus');if(!sb){showToast('Connexion cloud indisponible. Recharge la page.');status.textContent='Cloud indisponible';return}const e=(input?.value||'').trim();if(!e){showToast('Entre ton adresse email.');input?.focus();return}btn.disabled=true;btn.textContent='Envoi…';status.textContent='Envoi du lien de connexion…';try{const redirectTo=location.origin+location.pathname;const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:redirectTo}});if(error)throw error;status.textContent='Lien envoyé à '+e;showToast('Lien de connexion envoyé par email.')}catch(err){console.error('Magic link',err);status.textContent='Erreur de connexion';showToast('Erreur connexion : '+(err?.message||'inconnue'));alert('Erreur de connexion Supabase : '+(err?.message||'inconnue'))}finally{btn.disabled=false;btn.textContent='Connexion'}}async function logout(){if(!sb)return;try{await sb.auth.signOut()}catch(e){console.error(e)}currentUser=null;refreshAuth();showToast('Déconnecté.')}window.sendMagicLink=sendMagicLink;window.logout=logout;window.newTest=newTest;async function pushCloud(item){if(!sb||!currentUser)return false;const {error}=await sb.from('quiz_results').insert(toRow(item));if(error){console.error(error);return false}return true}function markSynced(date){const h=getLocal();const x=h.find(v=>v.date===date);if(x){x.cloud_synced=true;setLocal(h)}}async function syncLocalToCloud(){if(!currentUser)return;for(const item of getLocal().filter(x=>!x.cloud_synced)){if(await pushCloud(item))markSynced(item.date)}}async function handleFinishedQuiz(){let item=null;try{item=frame.contentWindow.getLastCompletedSession?.()}catch{}if(!item){try{item=JSON.parse(localStorage.getItem('inapLastCompletedSession')||'null')}catch{}}if(!item||item.date===lastHandledDate)return;lastHandledDate=item.date;if(currentUser){const ok=await pushCloud(item);if(ok){markSynced(item.date);showToast('Résultat sauvegardé localement et dans le cloud ✓')}else showToast('Résultat sauvegardé localement.')}else showToast('Résultat sauvegardé localement.')}function watch(){try{const d=frame.contentDocument;if(!d)return;const r=d.getElementById('result');if(!r)return;const visible=!r.classList.contains('hidden');if(visible&&!wasVisible)handleFinishedQuiz();wasVisible=visible}catch{}}function patchFrameHistory(){try{const w=frame.contentWindow,d=frame.contentDocument;if(!w||!d)return;w.showHistory=function(){try{if(typeof w.hideAll==='function')w.hideAll();else ['home','quiz','result','history','errorReview'].forEach(id=>d.getElementById(id)?.classList.add('hidden'));const panel=d.getElementById('history');if(!panel){location.href='dashboard.html';return}panel.classList.remove('hidden');if(typeof w.renderHistory==='function')w.renderHistory();d.defaultView.scrollTo({top:0,behavior:'auto'})}catch(e){console.error('History action',e);location.href='dashboard.html'}}}catch(e){console.error('History patch',e)}}frame.addEventListener('load',()=>{wasVisible=false;lastHandledDate=null;patchFrameHistory();setTimeout(()=>{patchFrameHistory();watch()},300)});setInterval(watch,500);if(sb)sb.auth.onAuthStateChange(()=>setTimeout(refreshAuth,0));refreshAuth();</script></body></html>
