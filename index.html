<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INAP QCM</title><style>html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#18212f}body{display:flex;flex-direction:column}.nav{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#111827;color:#fff;box-shadow:0 2px 10px #0002;z-index:2}.nav b{font-size:17px}.actions{display:flex;gap:8px}.actions button{border:1px solid #ffffff44;background:#ffffff12;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.actions button:hover{background:#ffffff22}iframe{border:0;width:100%;flex:1;background:#f5f7fb}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 25px #0004;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}@media(max-width:600px){.nav{padding:0 10px}.nav b{font-size:14px}.actions button{padding:8px 9px;font-size:12px}}</style></head><body><div class="nav"><b>INAP – QCM d'entraînement</b><div class="actions"><button onclick="document.getElementById('quizFrame').src='quiz.html'">Nouveau test</button><button onclick="location.href='dashboard.html'">Ma progression</button></div></div><iframe id="quizFrame" src="quiz.html" title="Quiz INAP"></iframe><div id="toast" class="toast">Résultat sauvegardé ✓</div><script>const KEY='inapHistoryV1';const frame=document.getElementById('quizFrame');let wasVisible=false;function parseBreakdown(text){const by={};(text||'').split(' • ').forEach(p=>{const m=p.match(/^([^:]+):\s*(\d+)\/(\d+)/);if(m)by[m[1]]=[+m[2],+m[3]]});return by}function saveResult(doc){const txt=doc.getElementById('finalScore')?.textContent||'';const m=txt.match(/(\d+)\/(\d+)\s*\((\d+)%\)/);if(!m)return;const score=+m[1],total=+m[2],percent=+m[3];const breakdown=doc.getElementById('breakdown')?.textContent||'';const by=parseBreakdown(breakdown);let exam=false;try{exam=!!frame.contentWindow.eval('exam')}catch{}const names=Object.keys(by);const scope=names.length===1?names[0]:(total===100?'Tout le programme':'Mix');const item={date:new Date().toISOString(),mode:exam?'Examen 120 min':'Entraînement',scope,score,total,percent,breakdown,by};let h=[];try{h=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{}h.push(item);localStorage.setItem(KEY,JSON.stringify(h));localStorage.setItem('inapLastScore',JSON.stringify({score,total,date:item.date}));const t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}function watch(){try{const d=frame.contentDocument;if(!d)return;const r=d.getElementById('result');if(!r)return;const visible=!r.classList.contains('hidden');if(visible&&!wasVisible)saveResult(d);wasVisible=visible}catch{}}frame.addEventListener('load',()=>{wasVisible=false;setTimeout(watch,300)});setInterval(watch,500);</script></body></html>
