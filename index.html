<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>INAP QCM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;color:#18212f}body{display:flex;flex-direction:column;min-width:0}.nav{min-height:58px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:#111827;color:#fff;box-shadow:0 2px 10px #0002;z-index:2;gap:10px}.nav b{font-size:17px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}.actions button{border:1px solid #ffffff44;background:#ffffff12;color:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.status{font-size:12px;color:#d1d5db}.authbox{display:flex;gap:6px;align-items:center}.authbox input{width:210px;max-width:100%;padding:8px;border-radius:8px;border:0}.hidden{display:none!important}iframe{border:0;width:100%;min-width:0;flex:1;background:#f5f7fb}.toast{position:fixed;right:18px;bottom:18px;background:#111827;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 8px 25px #0004;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;max-width:min(360px,calc(100vw - 24px));z-index:20}.toast.show{opacity:1;transform:none}@media(max-width:760px){.nav{padding:8px 10px;align-items:stretch;flex-direction:column}.nav b{font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;width:100%}.actions .status{grid-column:1/-1}.authbox{grid-column:1/-1;width:100%}.authbox input{flex:1;width:auto;min-width:0}.actions button{padding:8px 9px;font-size:12px;min-height:38px}.authbox button{flex:0 0 auto}iframe{min-height:calc(100vh - 145px)}}</style></head><body><div class="nav"><b>INAP – QCM d'entraînement</b><div class="actions"><span id="cloudStatus" class="status">Cloud : non connecté</span><div id="loginBox" class="authbox"><input id="email" type="email" placeholder="ton@email.com" autocomplete="email" onkeydown="if(event.key==='Enter'){window.sendMagicLink();}"><button id="loginBtn" type="button" onclick="window.sendMagicLink()">Connexion</button></div><button id="logoutBtn" class="hidden" type="button" onclick="window.logout()">Déconnexion</button><button type="button" onclick="window.newTest()">Nouveau test</button><button type="button" onclick="location.href='dashboard.html'">Ma progression</button><button type="button" onclick="location.href='erreurs.html'">Mes erreurs</button></div></div><div id="locked" style="flex:1;display:flex;align-items:center;justify-content:center;padding:30px"><div style="max-width:520px;text-align:center"><h1>Accès sécurisé</h1><p>Connecte-toi avec une adresse e-mail autorisée pour accéder aux QCM, à ta progression et à tes erreurs.</p></div></div><iframe id="quizFrame" class="hidden" title="Quiz INAP"></iframe><div id="toast" class="toast"></div><script>
const SUPABASE_URL='https://ltjpusvagvxvzqtwrnat.supabase.co',SUPABASE_KEY='sb_publishable_PFvxiUzbxH-3hwabCZdnpA_N03eidiP',sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const frame=document.getElementById('quizFrame'),locked=document.getElementById('locked'),loginBox=document.getElementById('loginBox'),logoutBtn=document.getElementById('logoutBtn'),cloudStatus=document.getElementById('cloudStatus');let currentUser=null;
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3500)}
function setAccess(ok){frame.classList.toggle('hidden',!ok);locked.classList.toggle('hidden',ok);if(ok&&!frame.getAttribute('src'))frame.src='quiz.html'}
async function refreshAuth(){const {data:{user}}=await sb.auth.getUser();currentUser=user||null;if(currentUser){const {data:allowed}=await sb.rpc('is_allowed_user');if(allowed!==true){await sb.auth.signOut();currentUser=null;showToast('Cette adresse e-mail n’est pas autorisée.')}}loginBox.classList.toggle('hidden',!!currentUser);logoutBtn.classList.toggle('hidden',!currentUser);cloudStatus.textContent=currentUser?'Connecté : '+currentUser.email:'Non connecté';setAccess(!!currentUser)}
async function sendMagicLink(){const input=document.getElementById('email'),e=input.value.trim();if(!e)return showToast('Entre ton adresse email.');const {error}=await sb.auth.signInWithOtp({email:e,options:{emailRedirectTo:location.origin+location.pathname}});showToast(error?'Erreur : '+error.message:'Lien de connexion envoyé par email.')}
async function logout(){await sb.auth.signOut();frame.removeAttribute('src');await refreshAuth()}
function newTest(){if(!currentUser)return showToast('Connexion requise.');frame.src='quiz.html?'+Date.now()}
function protectedPage(p){if(!currentUser)return showToast('Connexion requise.');location.href=p}
document.querySelector('button[onclick="location.href=\'dashboard.html\'"]').setAttribute('onclick',"protectedPage('dashboard.html')");
document.querySelector('button[onclick="location.href=\'erreurs.html\'"]').setAttribute('onclick',"protectedPage('erreurs.html')");
window.sendMagicLink=sendMagicLink;window.logout=logout;window.newTest=newTest;sb.auth.onAuthStateChange(()=>setTimeout(refreshAuth,0));refreshAuth();
</script></body></html>
