let pool=[],i=0,score=0,wrong=[],locked=false,exam=false,examAnswers=[],timerInt=null,timeLeft=0;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function start(s){exam=false;pool=shuffle(s==='ALL'?Q:Q.filter(q=>q[0]===s));init()}
function startExam(){exam=true;pool=shuffle(Q);timeLeft=120*60;init();timerInt=setInterval(()=>{timeLeft--;document.getElementById('timer').textContent=`${String(Math.floor(timeLeft/60)).padStart(2,'0')}:${String(timeLeft%60).padStart(2,'0')}`;if(timeLeft<=0){clearInterval(timerInt);finish()}},1000)}
function init(){i=0;score=0;wrong=[];examAnswers=[];home.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');render()}
function render(){locked=false;const q=pool[i];subject.textContent=q[0];count.textContent=`Question ${i+1}/${pool.length}`;document.getElementById('score').textContent=score;bar.style.width=`${(i/pool.length)*100}%`;question.textContent=q[1];answers.innerHTML='';feedback.className='feedback';feedback.innerHTML='';next.classList.add('hidden');q[2].forEach((a,idx)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+idx)+'. '+a;b.onclick=()=>choose(idx,b);answers.appendChild(b)})}
function choose(idx,b){if(locked)return;locked=true;const q=pool[i];const bs=[...answers.children];if(exam){examAnswers[i]=idx;b.classList.add('correct');next.classList.remove('hidden');return}if(idx===q[3]){score++;b.classList.add('correct');feedback.className='feedback ok';feedback.innerHTML='<b>Bonne réponse.</b><br>'+q[4]}else{b.classList.add('wrong');bs[q[3]].classList.add('correct');wrong.push(q);feedback.className='feedback ko';feedback.innerHTML='<b>Mauvaise réponse.</b><br>Bonne réponse : <b>'+q[2][q[3]]+'</b><br>'+q[4]}next.classList.remove('hidden');document.getElementById('score').textContent=score}
function nextQ(){i++;if(i>=pool.length)finish();else render()}
function finish(){if(timerInt){clearInterval(timerInt);timerInt=null}if(exam){score=0;wrong=[];pool.forEach((q,k)=>{if(examAnswers[k]===q[3])score++;else wrong.push(q)})}quiz.classList.add('hidden');result.classList.remove('hidden');bar.style.width='100%';finalScore.textContent=`${score}/${pool.length} (${Math.round(score/pool.length*100)}%)`;const by={};pool.forEach((q,k)=>{by[q[0]]??=[0,0];by[q[0]][1]++;const ok=exam?examAnswers[k]===q[3]:!wrong.includes(q);if(ok)by[q[0]][0]++});breakdown.textContent=Object.entries(by).map(([s,v])=>`${s}: ${v[0]}/${v[1]}`).join(' • ');localStorage.setItem('inapLastScore',JSON.stringify({score,total:pool.length,date:new Date().toISOString()}))}
function retryWrong(){if(!wrong.length){alert('Aucune erreur à revoir.');return}exam=false;pool=shuffle(wrong);init()}
function goHome(){if(timerInt){clearInterval(timerInt);timerInt=null}quiz.classList.add('hidden');result.classList.add('hidden');home.classList.remove('hidden')}
</script></body></html>
