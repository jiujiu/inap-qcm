<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>INAP QCM</title><style>body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f5f7fb;margin:0;color:#18212f}.wrap{max-width:880px;margin:auto;padding:24px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 28px #00000012}.top{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;align-items:center}.badge{padding:6px 10px;border-radius:999px;background:#eef2ff;font-size:13px}.progress{height:10px;background:#e8ecf3;border-radius:999px;overflow:hidden;margin:18px 0}.bar{height:100%;background:#111827;width:0}.answers button{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border:1px solid #d7dde8;background:#fff;border-radius:12px;font-size:16px;cursor:pointer}.answers button:hover{background:#f8fafc}.answers button.correct{background:#eaf8ee;border-color:#4caf67}.answers button.wrong{background:#fdecec;border-color:#d95c5c}.feedback{margin-top:16px;padding:16px;border-radius:12px;display:none}.feedback.ok{display:block;background:#eaf8ee}.feedback.ko{display:block;background:#fdecec}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button.primary,select{padding:12px 14px;border-radius:10px;border:1px solid #cfd6e2;background:#fff}.primary{background:#111827!important;color:#fff;border:none!important;cursor:pointer}.muted{color:#667085}.hidden{display:none}.scorebox{font-size:28px;font-weight:700}.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:18px}.homegrid button{padding:18px;border-radius:14px;border:1px solid #d7dde8;background:#fff;cursor:pointer}.small{font-size:13px}.timer{font-variant-numeric:tabular-nums}</style></head><body><div class="wrap"><div class="card"><div id="home"><h1>INAP – Tronc commun</h1><p class="muted">80 QCM fondés sur les 4 nouvelles synthèses Word et contrôlés avec les 4 supports PDF : 20 PGP, 20 DOAP, 20 CGE, 20 CCC.</p><div class="homegrid"><button onclick="start('ALL')"><b>Tout mélanger</b><br><span class="small">80 questions</span></button><button onclick="start('PGP')"><b>PGP</b><br><span class="small">20 questions</span></button><button onclick="start('DOAP')"><b>DOAP</b><br><span class="small">20 questions</span></button><button onclick="start('CGE')"><b>CGE</b><br><span class="small">20 questions</span></button><button onclick="start('CCC')"><b>CCC</b><br><span class="small">20 questions</span></button><button onclick="startExam()"><b>Mode examen</b><br><span class="small">80 questions · 2 h, sans correction immédiate</span></button></div></div><div id="quiz" class="hidden"><div class="top"><span class="badge" id="subject"></span><span id="count"></span><span>Score : <b id="score">0</b></span><span class="timer" id="timer"></span></div><div class="progress"><div class="bar" id="bar"></div></div><h2 id="question"></h2><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><div class="controls"><button class="primary hidden" id="next" onclick="nextQ()">Question suivante</button><button onclick="goHome()">Quitter</button></div></div><div id="result" class="hidden"><h2>Résultat</h2><div class="scorebox" id="finalScore"></div><p id="breakdown"></p><div class="controls"><button class="primary" onclick="goHome()">Retour à l’accueil</button><button onclick="retryWrong()">Revoir mes erreurs</button></div></div></div></div><script>
let Q=[];
async function loadQuestions(){const files=['questions-pgp.json','questions-doap.json','questions-cge.json','questions-ccc.json'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.json()})));Q=parts.flat()}
let pool=[],idx=0,scoreN=0,wrong=[],answered=false;var exam=false;let examAnswers=[],endAt=0,timerId=null;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pick20(scope){const subjects=['PGP','DOAP','CGE','CCC'];if(scope==='ALL')return subjects.flatMap(s=>shuffle(Q.filter(q=>q[0]===s)).slice(0,20));return shuffle(Q.filter(q=>q[0]===scope)).slice(0,20)}
async function start(scope){if(!Q.length)await loadQuestions();exam=false;pool=shuffle(pick20(scope));begin()}
async function startExam(){if(!Q.length)await loadQuestions();exam=true;pool=shuffle(pick20('ALL'));examAnswers=new Array(pool.length).fill(null);endAt=Date.now()+120*60*1000;clearInterval(timerId);timerId=setInterval(tick,1000);tick();begin()}
function begin(){idx=0;scoreN=0;wrong=[];answered=false;home.classList.add('hidden');result.classList.add('hidden');quiz.classList.remove('hidden');render()}
function render(){if(idx>=pool.length)return finish();const q=pool[idx];subject.textContent=q[0];count.textContent=`Question ${idx+1}/${pool.length}`;score.textContent=scoreN;bar.style.width=(idx/pool.length*100)+'%';question.textContent=q[1];feedback.className='feedback';feedback.textContent='';next.classList.add('hidden');answers.innerHTML='';answered=false;q[2].forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>choose(i);answers.appendChild(b)})}
function choose(i){if(answered)return;answered=true;const q=pool[idx];if(exam){examAnswers[idx]=i;[...answers.children].forEach(x=>x.disabled=true);next.classList.remove('hidden');return}const ok=i===q[3];if(ok)scoreN++;else wrong.push(q);[...answers.children].forEach((x,k)=>{x.disabled=true;if(k===q[3])x.classList.add('correct');if(k===i&&!ok)x.classList.add('wrong')});feedback.textContent=(ok?'Bonne réponse. ':'Mauvaise réponse. ')+q[4];feedback.classList.add(ok?'ok':'ko');score.textContent=scoreN;next.classList.remove('hidden')}
function nextQ(){idx++;render()}
function finish(){clearInterval(timerId);timer.textContent='';if(exam){scoreN=0;wrong=[];pool.forEach((q,i)=>{if(examAnswers[i]===q[3])scoreN++;else wrong.push(q)})}quiz.classList.add('hidden');result.classList.remove('hidden');const pct=Math.round(scoreN/pool.length*100);finalScore.textContent=`${scoreN}/${pool.length} (${pct}%)`;const by={};pool.forEach((q,i)=>{by[q[0]]??=[0,0];by[q[0]][1]++;const ok=exam?examAnswers[i]===q[3]:!wrong.includes(q);if(ok)by[q[0]][0]++});breakdown.textContent=Object.entries(by).map(([s,v])=>`${s}: ${v[0]}/${v[1]}`).join(' • ')}
function retryWrong(){if(!wrong.length)return goHome();exam=false;pool=shuffle([...wrong]);begin()}
function goHome(){clearInterval(timerId);quiz.classList.add('hidden');result.classList.add('hidden');home.classList.remove('hidden');timer.textContent=''}
function tick(){if(!exam)return;let r=Math.max(0,endAt-Date.now());const h=Math.floor(r/3600000),m=Math.floor((r%3600000)/60000),s=Math.floor((r%60000)/1000);timer.textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(r<=0)finish()}
loadQuestions().catch(e=>{document.querySelector('#home p.muted').textContent='Erreur de chargement des questions.';console.error(e)});
</script></body></html>
